<!doctype html>
<html lang="en" data-theme="charcoal-orange">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rohaanullah Khan | Shopify & E-commerce Specialist</title>
<meta name="description" content="Shopify & e-commerce store specialist &mdash; store design, UX, and automation tools." />
<meta property="og:title" content="Rohaanullah Khan | Shopify & E-commerce Specialist" />
<meta property="og:description" content="Shopify & e-commerce store specialist &mdash; store design, UX, and automation tools." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://rohaandigital.site/" />
<link rel="canonical" href="https://rohaandigital.site/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="/css/themes.css" />
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
<header class="site-header"><div id="site-nav"></div></header>

<main>
  <section class="hero">
    <div class="container hero__grid">
      <div class="reveal">
        <span class="title-pill" id="hero-title"></span>
        <h1 id="hero-name"></h1>
        <p class="tagline" id="hero-tagline"></p>
        <a href="/portfolio.html" class="btn btn-primary" id="hero-cta"></a>
      </div>
      <div class="reveal">
        <div class="hero__photo-frame">
          <img id="hero-photo" class="hero-photo" alt="Profile photo" />
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="stats-grid" id="stats-grid"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">What I Do</span>
        <h2>Services built to help your store sell</h2>
      </div>
      <div class="card-grid" id="services-teaser"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Featured Work</span>
        <h2>A few recent projects</h2>
      </div>
      <div class="work-grid" id="featured-work"></div>
      <div style="text-align:center; margin-top:40px;">
        <a href="/portfolio.html" class="btn btn-ghost" id="view-portfolio-btn">View Full Portfolio</a>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Kind Words</span>
        <h2>What clients say</h2>
      </div>
      <div class="testimonial-slider reveal" id="testimonial-slider"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Trusted By</span>
        <h2>Brands I've collaborated with</h2>
      </div>
      <div class="marquee reveal">
        <div class="marquee__track" id="brand-track"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="cta-banner reveal">
        <h2>Have a project in mind?</h2>
        <p>Let's build a store that turns your visitors into customers.</p>
        <a href="/contact.html" class="btn btn-primary">Get In Touch</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox__close" id="lightbox-close"></button>
  <div class="lightbox__content">
    <img id="lightbox-img" alt="" />
    <div class="lightbox__body">
      <span class="category-tag" id="lightbox-category"></span>
      <h3 id="lightbox-title"></h3>
      <p id="lightbox-desc"></p>
    </div>
  </div>
</div>

<script src="/js/icons.js"></script>
<script src="/js/main.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
